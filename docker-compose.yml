services:
  health:
    build: .
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      # SES credentials for alert mail, read from .env by the AWS default provider chain.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - /opt/docker/health/health.json:/config/health.json:ro

  cloudflared:
    image: cloudflare/cloudflared:2025.9.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - health
